[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "yam-arena"
version = "0.1.0"
description = "Bimanual I2RT YAM for Isaac Lab-Arena 0.3.1, and its Inspect Robots embodiment."
readme = "README.md"
requires-python = ">=3.12,<3.13"
authors = [{ name = "yam-arena contributors" }]
keywords = ["robotics", "simulation", "isaac-lab-arena", "yam", "bimanual", "inspect-robots", "evaluation"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
# Isaac Sim, Isaac Lab and Isaac Lab-Arena are not on PyPI: setup.sh installs this into Arena's venv.
dependencies = ["inspect-robots>=0.60", "inspect-robots-yam>=0.6", "numpy>=1.26"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.17"]

[project.entry-points."inspect_robots.embodiments"]
yam_arena = "yam_arena.inspect_embodiment:yam_arena_embodiment"

[project.entry-points."inspect_robots.policies"]
yam_scripted = "yam_arena.scripted:yam_scripted_policy"

[project.entry-points."inspect_robots.scorers"]
task_score = "yam_arena.scoring:task_score"

[project.urls]
Repository = "https://github.com/kairosiann/yam-isaac-lab-arena"
Issues = "https://github.com/kairosiann/yam-isaac-lab-arena/issues"

[tool.setuptools.packages.find]
include = ["yam_arena*"]

[tool.setuptools.package-data]
yam_arena = ["assets/yam/**/*"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM", "RUF"]
# Isaac Lab configclasses and Arena assets declare mutable class attributes by design.
ignore = ["RUF012"]

[tool.ruff.lint.per-file-ignores]
# The stage scripts start Isaac Sim before importing anything that needs it.
"scripts/*" = ["E402"]

[tool.ruff.lint.flake8-comprehensions]
allow-dict-calls-with-keyword-arguments = true

[tool.ruff.lint.isort]
known-first-party = ["yam_arena"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-ra --strict-markers"
