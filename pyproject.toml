[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "yam-arena"
version = "0.1.0"
description = "Bimanual I2RT YAM embodiment for Isaac Lab-Arena 0.3.1 (Isaac Lab 3.0, Isaac Sim 6.1) and its Inspect Robots wrapper"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "Apache-2.0 (code); MIT (assets/yam, see yam_arena/assets/yam/LICENSE.i2rt)" }
# Isaac Sim, Isaac Lab and Isaac Lab-Arena are not PyPI dependencies: install this editable into
# the Arena 0.3.1 venv. Editable matters: the URDF, meshes and converted USD are read from the
# checkout's yam_arena/assets/ directory.
dependencies = [
    "numpy",
    "inspect-robots>=0.60",
    "inspect-robots-yam>=0.6",
]

[tool.setuptools]
packages = ["yam_arena"]

[tool.setuptools.package-data]
yam_arena = ["assets/yam/**/*"]

[project.entry-points."inspect_robots.embodiments"]
yam_arena = "yam_arena.inspect_embodiment:yam_arena_embodiment"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM", "RUF"]
# Isaac Lab configclasses and Arena assets declare mutable class attributes by design.
ignore = ["RUF012"]

[tool.ruff.lint.per-file-ignores]
# The stage scripts start Isaac Sim before importing anything that needs it.
"scripts/*" = ["E402"]

[tool.ruff.lint.flake8-comprehensions]
allow-dict-calls-with-keyword-arguments = true

[tool.ruff.lint.isort]
known-first-party = ["yam_arena"]
